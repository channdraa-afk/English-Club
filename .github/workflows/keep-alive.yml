name: Keep Supabase Awake

on:
  schedule:
    # Berjalan otomatis setiap 2 hari sekali pada pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual dari dashboard GitHub jika ingin tes kapan saja

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          echo "🌸 Mengirim Keep-Alive Ping ke Supabase English Club SMEGA..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://hqsbmomlubeasmpnwkcb.supabase.co/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxc2Jtb21sdWJlYXNtcG53a2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MTg5NDEsImV4cCI6MjEwNTE5NDk0MX0.uEsHxNoOYMEGrq1wz8VDn45Jix_Os4wqwpD-VzGZ7lM' }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhxc2Jtb21sdWJlYXNtcG53a2NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MTg5NDEsImV4cCI6MjEwNTE5NDk0MX0.uEsHxNoOYMEGrq1wz8VDn45Jix_Os4wqwpD-VzGZ7lM' }}")

          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Sukses! Supabase English Club tetap aktif dan segar bugar."
          else
            echo "⚠️ Warning: Response status $HTTP_STATUS"
            exit 1
          fi
